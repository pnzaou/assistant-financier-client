# Analyse SonarCloud du front.
#
# `organization` et `projectKey` sont à ajuster après création du projet sur
# sonarcloud.io (Analyze new project → import du repo GitHub).
sonar.organization=pnzaou
sonar.projectKey=pnzaou_assistant-financier-client
sonar.projectName=Assistant Financier — Client

sonar.sources=src
sonar.tests=e2e
# Les tests unitaires vivent à côté du code qu'ils couvrent : Sonar doit savoir
# les distinguer, sinon il leur applique les règles du code de production.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/tests/**
sonar.sourceEncoding=UTF-8

# Rapport produit par `npm run test:coverage` et récupéré en artefact par la CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  coverage/**,\
  resultats-e2e/**,\
  public/**

sonar.coverage.exclusions=\
  src/main.tsx,\
  src/tests/**,\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/lib/types.ts,\
  e2e/**,\
  *.config.ts
