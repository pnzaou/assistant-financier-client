# Pipeline CI/CD du front Assistant Financier.
#
# Déclenchement (voir CONTRIBUTING.md) :
#   - push sur main / develop et tags v*  → build, publication de l'image
#   - pull request vers main / develop    → toutes les vérifications, sans publication
#
# On ne déclenche PAS sur « tous les push » : une PR ouverte depuis une branche
# du repo lancerait alors deux fois le même pipeline (push + pull_request).
# Les branches feat/* et fix/* sont donc couvertes par leur PR — ouvrir une PR
# en brouillon dès le premier commit suffit à avoir du retour en continu.
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_LOCALE: assistant-financier-client:scan

jobs:
  # ────────────────────────────────────────────────────────────────
  # 4c — Automatisation du build
  # 4d — Tests unitaires et de composants
  # ────────────────────────────────────────────────────────────────
  qualite:
    name: Lint, build & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud a besoin de l'historique pour attribuer les lignes à
          # leur auteur et calculer le périmètre « nouveau code ».
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Tests unitaires + couverture (Vitest)
        run: npm run test:coverage

      - name: Conservation du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: couverture-client
          path: coverage/lcov.info
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # 4d — Tests IHM / e2e sur la stack complète
  # ────────────────────────────────────────────────────────────────
  e2e:
    name: Tests e2e (Playwright)
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      # Seul Chromium est installé : les deux projets Playwright (desktop et
      # mobile) partagent le même moteur, rien d'autre à télécharger.
      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Clés JWT éphémères
        run: node scripts/generer-cles-e2e.mjs > .env.e2e

      - name: Démarrage de la stack (API + front en image de production)
        run: |
          docker compose -f docker-compose.e2e.yml --env-file .env.e2e up -d --wait
          echo "Front :" && curl -fsS http://localhost:8080/healthz
          echo "API   :" && curl -fsS http://localhost:5000/health

      - name: Tests e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run test:e2e

      # Traces, captures et vidéos des tests tombés : indispensables pour
      # diagnostiquer un échec qu'on ne reproduit pas en local.
      - name: Conservation du rapport e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: resultats-e2e/
          retention-days: 7

      - name: Journaux de la stack en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Arrêt de la stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ────────────────────────────────────────────────────────────────
  # 4e — DAST : le front est attaqué en boîte noire, tel qu'il sera servi
  # ────────────────────────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: qualite
    # Le scan prend plusieurs minutes : réservé aux branches d'intégration,
    # les PR sont déjà couvertes par CodeQL et Trivy.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Clés JWT éphémères
        run: node scripts/generer-cles-e2e.mjs > .env.e2e

      - name: Démarrage de la stack
        run: |
          docker compose -f docker-compose.e2e.yml --env-file .env.e2e up -d --wait
          curl -fsS http://localhost:8080/healthz

      # `baseline` parcourt le site sans attaque destructive : adapté à une CI.
      # Un scan « full » (actif) doit rester manuel, hors pipeline.
      - name: Scan ZAP (baseline)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/regles.tsv
          # -a : active aussi les règles passives « alpha ». -j : AJAX spider,
          # pertinent ici car les routes React ne sont pas des liens HTML.
          cmd_options: "-a -j"
          allow_issue_writing: false
          # Informatif pour l'instant : à passer à `true` une fois les en-têtes
          # manquants ajoutés au nginx, sinon la CI naît déjà rouge.
          fail_action: false

      - name: Journaux de la stack en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Arrêt de la stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ────────────────────────────────────────────────────────────────
  # 4e — Composition logicielle (SCA)
  # ────────────────────────────────────────────────────────────────
  dependances:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Rapport complet (informatif)
        run: |
          {
            echo '## Audit npm'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Seules les vulnérabilités critiques bloquent : les « high » des
      # dépendances transitives arrivent plus vite que leurs correctifs et
      # bloqueraient la CI en permanence. Dependabot ouvre des PR pour le reste.
      - name: Échec sur vulnérabilité critique
        run: npm audit --audit-level=critical

  # ────────────────────────────────────────────────────────────────
  # 4f — Qualimétrie
  # ────────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: qualite
    # Deux raisons de sauter ce job.
    #
    # 1. Les PR venant d'un fork n'ont pas accès au token : on saute plutôt que
    #    d'échouer sur une erreur d'authentification incompréhensible.
    # 2. Le plan gratuit de SonarCloud n'autorise que la branche PRINCIPALE du
    #    projet et les pull requests. Sur toute autre branche, l'analyse est
    #    bien téléversée mais la LECTURE du Quality Gate est refusée
    #    (« Not authorized or project not found »), ce qui fait échouer le job
    #    sans qu'aucun problème de qualité n'existe.
    #    `develop` doit donc être déclarée branche principale côté SonarCloud —
    #    c'est bien elle qui reçoit l'intégration continue.
    if: >-
      ${{ !github.event.pull_request.head.repo.fork
      && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupération de la couverture
        uses: actions/download-artifact@v4
        with:
          name: couverture-client
          path: coverage

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # `qualitygate.wait` bloque le job tant que Sonar n'a pas rendu son
          # verdict : sans ça le job passerait au vert avant l'analyse.
          args: >
            -Dsonar.qualitygate.wait=true

  # ────────────────────────────────────────────────────────────────
  # 4b — Containerisation et publication de l'image
  # ────────────────────────────────────────────────────────────────
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: qualite
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Mise en place de Buildx
        uses: docker/setup-buildx-action@v3

      # Construite localement d'abord : Trivy doit pouvoir la scanner AVANT
      # qu'elle ne soit publiée.
      - name: Build de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true
          tags: ${{ env.IMAGE_LOCALE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de l'image (Trivy) — rapport complet
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCALE }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Publication du rapport dans l'onglet Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # Bloquant, mais seulement sur ce qui est corrigeable : une CVE critique
      # sans correctif amont ne doit pas figer les livraisons.
      - name: Échec sur CVE critique corrigeable
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCALE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # develop → tag `develop` (staging) ; main → `main` + `latest` ;
      # tag v1.2.0 → `1.2.0`, `1.2` et `latest`. Le tag `sha-<commit>` est
      # toujours produit : c'est lui qu'on épingle dans les manifests K8s.
      - name: Calcul des tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Rejoue le build depuis le cache : quasi instantané, aucune couche
      # reconstruite.
      - name: Publication sur GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ────────────────────────────────────────────────────────────────
  # 4h — Déclenchement du déploiement continu
  # ────────────────────────────────────────────────────────────────
  declencher-deploiement:
    name: Déclencher le déploiement
    runs-on: ubuntu-latest
    needs: image
    # Uniquement sur develop, et uniquement sur un push : une pull request
    # construit et scanne l'image mais ne la publie pas — il n'y aurait rien
    # à déployer.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      # Le GITHUB_TOKEN est limité à CE dépôt : il ne peut pas déclencher un
      # workflow ailleurs. D'où un jeton dédié, à créer avec la portée `repo`
      # et à stocker dans le secret JETON_DECLENCHEMENT_INFRA.
      - name: Appeler le workflow de déploiement du dépôt infra
        env:
          JETON: ${{ secrets.JETON_DECLENCHEMENT_INFRA }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::error title=Secret manquant::JETON_DECLENCHEMENT_INFRA n'est pas configuré. Le déploiement ne peut pas être déclenché."
            exit 1
          fi
          # `type=sha` produit un sha COURT (7 caractères) : le tag doit
          # correspondre exactement à celui publié sur GHCR.
          TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "Déploiement demandé pour le tag $TAG"
          curl --fail --silent --show-error -X POST             -H "Authorization: token $JETON"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/pnzaou/assistant-financier-infra/dispatches             -d "{\"event_type\":\"deployer\",\"client_payload\":{\"environnement\":\"staging\",\"tag_client\":\"$TAG\"}}"
