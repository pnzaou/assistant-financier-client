server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sonde pour les probes Kubernetes. Déclarée en `location =` (correspondance
  # exacte, prioritaire sur le préfixe `/`) : sinon try_files renverrait
  # index.html en 200 et la probe passerait même sans fichiers statiques.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Configuration injectée au démarrage du conteneur : elle diffère d'un
  # environnement à l'autre pour une image identique, donc jamais de cache.
  # Sans ça, un navigateur garderait l'URL d'API de l'environnement précédent.
  # Pas de directive `expires` ici : elle émettrait un second en-tête
  # Cache-Control, et deux valeurs concurrentes sur la même réponse sont
  # interprétées diversement par les proxies.
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # index.html référence les bundles fingerprintés : le mettre en cache ferait
  # charger d'anciens assets, supprimés par le déploiement suivant.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Les assets de Vite sont fingerprintés : cache long sans risque
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA : toute route inconnue renvoie index.html (React Router côté navigateur)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
