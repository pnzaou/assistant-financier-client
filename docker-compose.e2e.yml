# ─────────────────────────────────────────────────────────────────
# Stack éphémère pour les tests IHM/e2e et le scan DAST du front.
#
# Le front est CONSTRUIT depuis ce repo (c'est le code sous test) ; l'API est
# TIRÉE depuis GHCR (image publiée par la CI du repo serveur). C'est le premier
# vrai bénéfice de la publication d'images : plus besoin de cloner et compiler
# l'autre repo pour tester l'intégration.
#
#   node -e "..." > .env.e2e            # paire de clés RSA jetable
#   docker compose -f docker-compose.e2e.yml --env-file .env.e2e up -d --wait
#   E2E_BASE_URL=http://localhost:8080 npm run test:e2e
#
# Prérequis : le package ghcr.io/pnzaou/assistant-financier-server doit être
# PUBLIC (Packages → Package settings → Change visibility). Le GITHUB_TOKEN de
# ce repo n'a pas accès aux packages d'un autre repo.
# ─────────────────────────────────────────────────────────────────

name: assistant-financier-e2e

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: assistant_financier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d assistant_financier"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    # `develop` par défaut ; la CI épingle un sha précis via SERVER_TAG.
    image: ghcr.io/pnzaou/assistant-financier-server:${SERVER_TAG:-develop}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PAS `production` — et c'est délibéré : en production le serveur pose
      # ses cookies de session avec `secure: true`, donc réservés à HTTPS. Les
      # tests tournent en HTTP sur localhost : le navigateur refuserait de les
      # renvoyer et TOUS les parcours authentifiés échoueraient.
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://e2e:e2e@db:5432/assistant_financier?schema=public
      # Origine exacte du front tel que le navigateur le voit (port compris) :
      # le CORS la compare telle quelle.
      CLIENT_URLS: http://localhost:8080
      COOKIE_SECRET: secret-e2e-jetable
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      # Le conteneur applique les migrations et le seed avant d'écouter.
      start_period: 40s

  client:
    build:
      context: .
      target: prod
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Injectée dans /config.js au démarrage. C'est l'URL vue par le
      # NAVIGATEUR (le runner), pas par le réseau Docker.
      API_URL: http://localhost:5000
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
